name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

# Triggered by the GitHub Release that release.yml (release-please) creates, or
# manually. `.npmrc` sets ignore-scripts=true, which disables the `prepack`
# lifecycle, so lib/ — the compiled entry point that `exports` points at, and the
# only gitignored thing the tarball ships — is built explicitly here. wasm/ is
# committed, so no JDK and no submodule are needed to publish.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      # Guard: never publish a module that fails its runtime tests.
      - run: npm run test-only
      - name: Compile src/ into lib/
        run: npm run tsc
      - name: Check the tarball ships wasm/ and lib/
        run: |
          npm pack
          tar -tzf openchemlib-wasm-*.tgz | tee tarball.txt
          for entry in package/wasm/data.js package/wasm/runtime.js package/lib/index.js; do
            grep -q "^$entry" tarball.txt || {
              echo "::error::the tarball ships no $entry"
              exit 1
            }
          done
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOT_TOKEN }}
